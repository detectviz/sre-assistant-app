services:
  grafana:
    user: root
    container_name: 'sre-assistant-app'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.2.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
      - 2345:2345/tcp # delve
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    volumes:
      - ../dist:/var/lib/grafana/plugins/sre-assistant-app
      - ../sre-silence-rules-plugin/dist:/var/lib/grafana/plugins/sre-silence-rules-plugin
      - ../sre-tag-governance-plugin/dist:/var/lib/grafana/plugins/sre-tag-governance-plugin
      - ../sre-notification-history-plugin/dist:/var/lib/grafana/plugins/sre-notification-history-plugin
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/sre-assistant-app

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.sre-assistant-app:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: sre-assistant-app,sre-silence-rules-plugin,sre-tag-governance-plugin,sre-notification-history-plugin
